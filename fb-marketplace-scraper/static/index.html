<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%234f46e5'/%3E%3Ccircle cx='29' cy='28' r='13' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M39 38 L48 47' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#4f46e5"/>
    <circle cx="29" cy="28" r="13" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M39 38 L48 47" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>Marketplace Search</h1>
    <p class="tag">Find deals on Facebook Marketplace</p>
  </div>
</header>

<main>
  <form id="search-form" class="panel" autocomplete="off">
    <div class="main-row">
      <input id="query" type="text" placeholder='What are you looking for? Try "patio set" or "kids bike"' required>
      <button id="go" type="submit">Search</button>
    </div>
    <div class="filters">
      <label>City
        <input id="location" placeholder="e.g. sanfrancisco">
      </label>
      <label>Min $
        <input id="min-price" type="number" min="0" placeholder="any">
      </label>
      <label>Max $
        <input id="max-price" type="number" min="0" placeholder="any">
      </label>
      <label>Posted
        <select id="days">
          <option value="">Any time</option>
          <option value="1">Last 24 hours</option>
          <option value="7">Last week</option>
          <option value="30">Last month</option>
        </select>
      </label>
      <label>Sort by
        <select id="sort">
          <option value="newest">Newest first</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
          <option value="relevance">Best match</option>
        </select>
      </label>
    </div>
  </form>

  <section id="status" class="status" aria-live="polite"></section>
  <section id="results" class="grid"></section>
</main>

<footer>
  Runs on this computer only · results open on facebook.com · personal use
  <span id="mode-badge" class="badge"></span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
